name: Still

options:
  bundleIdPrefix: com.chen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Signed with the maintainer's team, so macOS keeps one identity across rebuilds and asks for Photos access
    # once. Release builds for distribution override the identity with Developer ID
    # (Scripts/package.sh). Nothing here needs a provisioning profile.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 3287GPH578
    # Required for notarization; it also guards the app against code injection.
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      # Release builds are for distribution: no debugger entitlement (get-task-allow), which
      # notarization rejects. Xcode otherwise injects it into every `xcodebuild build`.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  StillCore:
    type: framework
    platform: macOS
    sources: [StillCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chen.StillCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  Still:
    type: application
    platform: macOS
    sources: [Still]
    dependencies:
      - target: StillCore
    info:
      path: Still/Info.plist
      properties:
        # Lets Finder's Open With and the Dock icon hand videos to the app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
    entitlements:
      path: Still/Still.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.photos-library: true
        # Apple Maps: the place name and map for an included location, and searching for one.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chen.Still
        PRODUCT_NAME: Still
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Still
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Still saves the Live Photos you create to your Photos library.
        MARKETING_VERSION: "0.1.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      configs:
        # Debug builds get their own identity, so they run beside an installed copy without sharing its
        # sandbox container or Photos permission, and the launcher tells them apart.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.chen.Still.debug
          INFOPLIST_KEY_CFBundleDisplayName: Still Debug

  StillCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [StillCoreTests]
    dependencies:
      - target: StillCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chen.StillCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Still:
    build:
      targets:
        Still: all
        StillCoreTests: [test]
    test:
      targets: [StillCoreTests]
    run:
      config: Debug
